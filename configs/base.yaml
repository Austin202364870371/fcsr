project_name: fcsr
seed: 42

data:
  raw_skills: data/raw/skills_easy.jsonl.gz
  raw_tasks: data/raw/evaluation_queries.jsonl.gz
  contract_sample: data/samples/sample_skills.jsonl.gz
  sample_manifest: data/samples/manifest.json
  contracts: data/contracts/contracts.jsonl.gz
  contract_failures: data/contracts/failures.jsonl.gz
  contract_manifest: data/contracts/manifest.json
  single_skill_queries: data/synthetic/single_skill/queries.jsonl.gz
  single_skill_query_failures: data/synthetic/single_skill/query_failures.jsonl.gz
  single_skill_local_negatives: data/synthetic/single_skill/local_negatives.jsonl.gz
  single_skill_semantic_fn_review: data/synthetic/single_skill/semantic_fn_review.jsonl.gz
  single_skill_biencoder_train: data/synthetic/single_skill/train_biencoder.jsonl.gz
  single_skill_reranker_train: data/synthetic/single_skill/train_reranker.jsonl.gz
  multiskill_manifest: data/synthetic/multi_skill/manifest.json
  multiskill_candidates: data/synthetic/multi_skill/candidates.jsonl.gz
  multiskill_rejections: data/synthetic/multi_skill/candidate_rejections.jsonl.gz
  multiskill_queries: data/synthetic/multi_skill/queries.jsonl.gz
  multiskill_query_failures: data/synthetic/multi_skill/query_failures.jsonl.gz
  multiskill_review_queue: data/synthetic/multi_skill/review_queue.jsonl.gz
  weighted_biencoder_train: data/training/biencoder.jsonl.gz
  weighted_reranker_train: data/training/reranker.jsonl.gz
  weighted_semantic_fn_review: data/training/semantic_fn_review.jsonl.gz
contracts:
  schema_version: contract_v2
  canonical_language: en
  sampling_strategy: category_language_stratified
  sample_size: 32000
  llm:
    provider: deepseek
    model: deepseek-v4-flash
    thinking: disabled
    concurrency: 16
    temperature: 0.0
    max_attempts: 3
    backoff_seconds: 2.0

training_mixture:
  strategy: single_pass_type_weighted_loss
  replicate_multiskill_queries: false
  biencoder_multi_loss_weight: 1.5
  reranker_multi_loss_weight: 3.0

retrieval:
  top_n: 100
  rerank_top_k: 20
  bundle_k: 10
  semantic_negative_top_k: 50
  embedding_fn_threshold: 0.95
  trigram_fn_threshold: 0.85

selection:
  alpha_coverage: 1.0
  beta_duplicate: 0.5
  gamma_context_cost: 0.0

evaluation:
  k_values: [10, 20, 50, 100]
