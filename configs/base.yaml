project_name: fcsr
seed: 42

data:
  raw_skills: data/raw/skills_easy.jsonl.gz
  raw_tasks: data/raw/evaluation_queries.jsonl.gz
  contract_sample: data/contracts_32k/sample_skills.jsonl.gz
  contracts: data/contracts_32k_prompt006/contracts.jsonl.gz
  contract_failures: data/contracts_32k_prompt006/failures.jsonl.gz
  contract_manifest: data/contracts_32k/manifest.json
  single_skill_queries: data/synthetic/single_skill_v1/queries.jsonl.gz
  single_skill_biencoder_train: data/synthetic/single_skill_v1/train_biencoder.jsonl.gz
  single_skill_reranker_train: data/synthetic/single_skill_v1/train_reranker.jsonl.gz
  multiskill_manifest: data/synthetic/multiskill_v1/manifest.json
  multiskill_candidates: data/synthetic/multiskill_v1/candidates.jsonl.gz
  multiskill_rejections: data/synthetic/multiskill_v1/candidate_rejections.jsonl.gz

contracts:
  schema_version: contract_v2
  canonical_language: en
  sampling_strategy: category_language_stratified
  sample_size: 32000
  llm:
    provider: deepseek
    model: deepseek-v4-flash
    thinking: disabled
    concurrency: 16
    temperature: 0.0
    max_attempts: 3
    backoff_seconds: 2.0

retrieval:
  top_n: 100
  rerank_top_k: 20
  bundle_k: 10
  semantic_negative_top_k: 50
  embedding_fn_threshold: 0.95
  trigram_fn_threshold: 0.85

selection:
  alpha_coverage: 1.0
  beta_duplicate: 0.5
  gamma_context_cost: 0.0

evaluation:
  k_values: [10, 20, 50, 100]
